<main id="main">

<div class="wrap page-head"><span class="kicker">Contact</span><h1>Write to us.</h1><p class="lead">Leave an email address or a phone number and a few words. We get in touch.</p></div>
<section class="wrap sec sec--flush"><div class="contact-card" id="contact-box">
<form class="stack" id="contact-form" novalidate>
  <div class="field"><label for="k-name">Your name (optional)</label><input class="input" id="k-name" type="text" autocomplete="name"></div>
  <div class="field"><label for="k-email">Email address</label><input class="input" id="k-email" type="email" autocomplete="email" aria-describedby="k-err-email"><span class="error-text" id="k-err-email" role="alert"></span></div>
  <div class="field"><label for="k-phone">Phone number</label><span class="hint">Use a + and the country code.</span><input class="input" id="k-phone" type="tel" autocomplete="tel" aria-describedby="k-err-phone"><span class="error-text" id="k-err-phone" role="alert"></span></div>
  <div class="field"><label for="k-msg">What would you like to ask?</label><textarea class="textarea" id="k-msg" maxlength="1000"></textarea></div>
  <label class="choice"><input type="checkbox" id="k-consent"> It is fine to contact me about this.</label>
  <div class="field"><span class="error-text" id="k-cerr" role="alert"></span></div>
  <div class="trap" aria-hidden="true"><label>Leave this empty <input type="text" id="k-trap" tabindex="-1" autocomplete="off"></label></div>
  <div><button class="btn" type="submit">Send</button></div>
</form>
<div id="contact-result" role="status" aria-live="polite"></div>
</div></section>
</main>
