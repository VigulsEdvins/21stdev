<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search-First Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sfh-demo">
  <header class="sfh-header">
    <div class="sfh-top">
      <a class="sfh-logo" href="#top">Shopwise</a>
      <form class="sfh-search" role="search" data-edv-form="skip">
        <label class="sfh-sr">Search products</label>
        <input aria-label="Search products" class="sfh-input" type="search" placeholder="Search for products, brands and more" autocomplete="off">
        <button class="sfh-go" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </form>
      <nav class="sfh-icons" aria-label="Account"><a href="#" data-edv-nav="1">Account</a><a class="sfh-cart" href="#" data-edv-nav="2">Cart <span class="sfh-count" aria-label="2 items">2</span></a></nav>
      <div data-edv-lang></div>
    </div>
    <nav class="sfh-cats" aria-label="Categories"><a href="#" data-edv-nav="3">New in</a><a href="#" data-edv-nav="4">Women</a><a href="#" data-edv-nav="5">Men</a><a href="#" data-edv-nav="6">Home</a><a href="#" data-edv-nav="7">Sale</a></nav>
  </header>
</div>
  <script src="script.js"></script>
</body>
</html>
