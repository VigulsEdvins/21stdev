<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Cloud Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="lcg-demo" aria-labelledby="lcgTitle">
  <h2 class="lcg-title" id="lcgTitle">Trusted by teams at</h2>
  <ul class="lcg-grid">
    <li class="lcg-item"><span class="lcg-mark">Northwind</span></li>
    <li class="lcg-item"><span class="lcg-mark">Lumina</span></li>
    <li class="lcg-item"><span class="lcg-mark">Aperture</span></li>
    <li class="lcg-item"><span class="lcg-mark">Vertex</span></li>
    <li class="lcg-item"><span class="lcg-mark">Orbital</span></li>
    <li class="lcg-item"><span class="lcg-mark">Kestrel</span></li>
  </ul>
</section>
  <script src="script.js"></script>
</body>
</html>
