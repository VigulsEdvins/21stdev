<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5-Column Staggered Parallax Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="edv-gallery" id="edvGallery">
    <header class="edv-hud">
      <div class="edv-brand">EDVLABS ROSTER // ARCHIVE</div>
      <div class="edv-hint">Move cursor horizontally to pan &bull; Scroll wheel to shift columns</div>
    </header>
    <div class="edv-pan-stage" id="edvPanStage">
      <div class="edv-columns" id="edvColumns"></div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
