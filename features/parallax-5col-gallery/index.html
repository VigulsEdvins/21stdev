<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5-Column Staggered Parallax Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="viv-gallery" id="vivGallery">
    <header class="viv-hud">
      <div class="viv-brand">VIVMGMT // ROSTER ARCHIVE</div>
      <div class="viv-hint">Move cursor horizontally to pan &bull; Scroll wheel to shift columns</div>
    </header>
    <div class="viv-pan-stage" id="vivPanStage">
      <div class="viv-columns" id="vivColumns"></div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
