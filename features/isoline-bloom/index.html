<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contour Bloom</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="ib-stage" id="ibStage">
