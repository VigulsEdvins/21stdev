<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitemap Footer With Newsletter Signup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<footer class="snf-demo">
    <div class="snf-inner">
      <div class="snf-brand">
        <a class="snf-logo" href="#top">Northwind</a>
        <p class="snf-tag">Tools for teams that ship. One short email a month, no spam.</p>
        <form class="snf-form" novalidate>
          <label class="snf-label">Email address</label>
          <div class="snf-row">
            <input class="snf-input" type="email" name="email" placeholder="you@company.com" autocomplete="email" required>
            <button class="snf-submit" type="submit">Subscribe</button>
          </div>
          <p class="snf-msg" role="status"></p>
        </form>
      </div>
      <nav class="snf-col" aria-label="Product"><h2>Product</h2><a href="#features">Features</a><a href="#pricing">Pricing</a><a href="#changelog">Changelog</a><a href="#roadmap">Roadmap</a></nav>
      <nav class="snf-col" aria-label="Company"><h2>Company</h2><a href="#about">About</a><a href="#careers">Careers</a><a href="#press">Press</a><a href="#contact">Contact</a></nav>
      <nav class="snf-col" aria-label="Resources"><h2>Resources</h2><a href="#docs">Documentation</a><a href="#guides">Guides</a><a href="#status">Status</a><a href="#community">Community</a></nav>
    </div>
    <div class="snf-legal"><span>&copy; 2026 Northwind Ltd.</span><span class="snf-links"><a href="#privacy">Privacy</a><a href="#terms">Terms</a><a href="#cookies">Cookies</a></span></div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
