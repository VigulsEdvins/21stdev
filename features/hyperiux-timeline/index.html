<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyperiux Product Storyline — Horizontal Scroll Timeline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="timeline-viewport" id="timelineViewport">
    <!-- Top Navigation & Controls Bar -->
    <header class="timeline-header">
      <div class="header-brand">
        <span class="brand-pill">Hyperiux Vault</span>
        <span class="brand-sub">Product Roadmap & Storyline</span>
      </div>
      <div class="header-controls">
        <button type="button" class="btn-theme" id="btnThemeToggle" aria-label="Toggle Dark / Light Mode" title="Toggle Theme">
          <span class="theme-label">Theme</span>
        </button>
        <button type="button" class="btn-ctrl" id="btnReset" title="Scroll to Beginning">Start</button>
        <div class="progress-container">
          <input type="range" id="timelineProgress" min="0" max="100" value="0" step="0.1" aria-label="Timeline progress scrubber" />
        </div>
        <button type="button" class="btn-ctrl" id="btnAutoScroll" title="Toggle Smooth Travel">Auto Scroll</button>
      </div>
    </header>

    <!-- Horizontal Journey Track -->
    <main class="timeline-track-wrap" id="trackWrap">
      <div class="timeline-slider" id="timelineSlider">
        <!-- Leading Vision Card -->
        <div class="vision-card">
          <div class="vision-card-inner">
            <img class="vision-img" src="/assets/library/photo-1522071820081-009f0129c71c-6f31eec6.jpg" alt="Founding Vision Workspace" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'600\' viewBox=\'0 0 600 600\'><defs><linearGradient id=\'vg\' x1=\'0\' y1=\'0\' x2=\'100%\' y2=\'100%\'><stop offset=\'0%\' stop-color=\'%23ff5f00\'/><stop offset=\'100%\' stop-color=\'%2318181b\'/></linearGradient></defs><rect width=\'600\' height=\'600\' fill=\'url(%23vg)\'/><text x=\'50%\' y=\'50%\' fill=\'white\' font-family=\'sans-serif\' font-size=\'32\' font-weight=\'bold\' text-anchor=\'middle\'>FOUNDING VISION</text></svg>';" />
            <div class="vision-overlay">
              <span class="vision-tag">Phase 00 &bull; Genesis</span>
              <h3 class="vision-heading">Building in Public</h3>
            </div>
          </div>
        </div>

        <!-- Main Journey Rail & Alternating Milestones -->
        <div class="journey-stage" id="journeyStage">
          <!-- Horizontal Connecting Active Rail -->
          <div class="rail-container">
            <div class="rail-node rail-start"></div>
            <div class="rail-line-bg">
              <div class="rail-line-active" id="railLineActive"></div>
            </div>
            <div class="rail-node rail-end"></div>
          </div>

          <!-- Top Row Milestones (Above Rail) -->
          <div class="row-top">
            <div class="row-header">
              <h2 class="section-title">Product<br />Storyline</h2>
            </div>
            <div class="milestones-wrap" id="topMilestonesWrap">
              <!-- Dynamically rendered / populated -->
            </div>
          </div>

          <!-- Bottom Row Milestones (Below Rail) -->
          <div class="row-bottom">
            <div class="row-header">
              <p class="period-label">2020 &mdash; 2026</p>
            </div>
            <div class="milestones-wrap" id="bottomMilestonesWrap">
              <!-- Dynamically rendered / populated -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Scroll Hint -->
    <footer class="timeline-footer">
      <span class="footer-hint">Drag, use wheel, or trackpad to travel along the product timeline</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
