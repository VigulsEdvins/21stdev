<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surf 3D Sine-Wave Ribbon & Physics Stream</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="surf-stage" id="surf-container">
    <div class="surf-hud-top">
      <span>THE LOOKBACK // SURF 3D RIBBON</span>
      <span class="surf-hud-badge" id="surf-floating-info">HOVER OR DRAG STREAM</span>
    </div>
    <div class="surf-ribbon" id="surf-ribbon"></div>
    <div class="surf-hud-bottom">
      <span>Scroll wheel, drag horizontally, or use ← / → keys</span>
      <span id="surf-vel-readout">WAVE AMPLITUDE: 1.0x</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
