<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Orbit Band</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="ma-band">
  <div class="ma-info">
    <p class="ma-label">Mission 7 / Low orbit survey</p>
    <h2 class="ma-title">Scrub the orbit</h2>
    <p class="ma-meta">Drag the probe or use the slider to move along the path.</p>
    <dl class="ma-data">
      <div><dt>Altitude</dt><dd><span class="ma-alt">412</span> km</dd></div>
      <div><dt>Velocity</dt><dd><span class="ma-vel">7.66</span> km/s</dd></div>
      <div><dt>Phase</dt><dd class="ma-phase">Day side</dd></div>
    </dl>
    <label class="ma-range-wrap"><span class="ma-lab">Orbit position</span>
      <input class="ma-range" type="range" min="0" max="359" value="40" aria-label="Orbit position in degrees"></label>
  </div>
  <svg class="ma-view" viewBox="-200 -150 400 300" role="img" aria-label="Probe orbiting a planet">
    <defs>
      <radialGradient id="ma-g" cx="35%" cy="35%"><stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#14367a"/></radialGradient>
    </defs>
    <ellipse class="ma-path" cx="0" cy="0" rx="150" ry="95" transform="rotate(-18)"/>
    <circle class="ma-planet" r="52" fill="url(#ma-g)"/>
    <g class="ma-probe" tabindex="-1"><circle r="14" class="ma-halo"/><rect x="-6" y="-4" width="12" height="8" rx="2" class="ma-body"/><path d="M-16 0h10M6 0h10" class="ma-wing"/></g>
  </svg>
</section>
<script src="script.js"></script>
</body>
</html>
