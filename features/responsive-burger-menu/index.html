<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morphing Burger &amp; Staggered Overlay Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="nav-demo-shell" id="navShell">
    <header class="topbar">
      <span class="brand">EDVLABS</span>
      <button class="burger-btn" id="burgerBtn" type="button" aria-expanded="false" aria-label="Toggle Menu">
        <span class="burger-label" id="burgerLabel">MENU</span>
        <span class="burger-lines">
          <span class="line line-1"></span>
          <span class="line line-2"></span>
        </span>
      </button>
    </header>

    <div class="page-backdrop">
      <p>Click the top-right trigger to toggle the staggered full-screen navigation curtain.</p>
    </div>

    <nav class="overlay-menu" id="overlayMenu">
      <ul class="menu-links">
        <li style="--i:0"><a href="#"><span>01</span>Studio <em>Roster</em></a></li>
        <li style="--i:1"><a href="#"><span>02</span>Studio <em>Notes</em></a></li>
        <li style="--i:2"><a href="#"><span>03</span>Shared <em>Archive</em></a></li>
        <li style="--i:3"><a href="#"><span>04</span>Northport &amp; Lakeside <em>Offices</em></a></li>
      </ul>
    </nav>
  </div>
  <script src="script.js"></script>
</body>
</html>
