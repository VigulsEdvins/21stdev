<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morphing Burger &amp; Staggered Overlay Menu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="nav-demo-shell">
    <header class="topbar">
      <span class="brand">EDVLABS</span>
      <div data-edv-lang></div>
      <button class="burger-btn" type="button" aria-expanded="false" aria-label="Toggle Menu">
        <span class="burger-label">MENU</span>
        <span class="burger-lines">
          <span class="line line-1"></span>
          <span class="line line-2"></span>
        </span>
      </button>
    </header>

    <nav class="overlay-menu">
      <ul class="menu-links" data-edv-menu data-edv-menu-max="8">
        <li style="--i:0"><a href="#" data-edv-nav="1"><span data-edv-count>01</span><i class="bm-label" data-edv-label>Studio <em>Roster</em></i></a></li>
        <li style="--i:1"><a href="#" data-edv-nav="2"><span data-edv-count>02</span><i class="bm-label" data-edv-label>Studio <em>Notes</em></i></a></li>
        <li style="--i:2"><a href="#" data-edv-nav="3"><span data-edv-count>03</span><i class="bm-label" data-edv-label>Shared <em>Archive</em></i></a></li>
        <li style="--i:3"><a href="#" data-edv-nav="4"><span data-edv-count>04</span><i class="bm-label" data-edv-label>City A &amp; City B <em>Offices</em></i></a></li>
      </ul>
    </nav>
  </div>
  <script src="script.js"></script>
</body>
</html>
