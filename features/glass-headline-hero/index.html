<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Type Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="gh-hero" id="ghHero">
    <canvas class="gh-cv" id="ghCv" aria-hidden="true"></canvas>
    <div class="gh-inner">
      <p class="gh-eyebrow">Studio notes &middot; Vol. 9</p>
      <h1 class="gh-title" id="ghTitle"><span class="gh-l">Bend the</span><span class="gh-l">light</span></h1>
      <p class="gh-lead">Thick glass letters over a slow field of colour. Move your pointer and the highlights slide with it.</p>
      <a class="gh-btn" href="#">Explore the work</a>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
