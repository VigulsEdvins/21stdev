<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Navigation With Announcement Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sna-demo">
    <div class="sna-announce" role="region" aria-label="Announcement">
      <p>Free shipping on orders over 60 &nbsp;&middot;&nbsp; <a href="#" data-edv-nav="1">Shop the autumn edit</a></p>
      <button class="sna-close" type="button" aria-label="Dismiss announcement"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <header class="sna-header">
      <nav class="sna-side sna-left" aria-label="Primary" data-edv-menu data-edv-menu-max="4"><a href="#" data-edv-nav="2">Shop</a><a href="#" data-edv-nav="3">Journal</a><a href="#" data-edv-nav="4">About</a></nav>
      <a class="sna-wordmark" href="#top">Maison Verre</a>
      <nav class="sna-side sna-right" aria-label="Secondary"><a href="#" data-edv-nav="5">Search</a><a href="#" data-edv-nav="6">Account</a><a href="#" data-edv-nav="7">Bag (0)</a><div data-edv-lang></div></nav>
    </header>
  </div>
  <script src="script.js"></script>
</body>
</html>
