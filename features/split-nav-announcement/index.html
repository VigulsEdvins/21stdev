<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Navigation With Announcement Bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sna-demo">
    <div class="sna-announce" id="snaAnnounce" role="region" aria-label="Announcement">
      <p>Free shipping on orders over 60 &nbsp;&middot;&nbsp; <a href="#sale">Shop the autumn edit</a></p>
      <button class="sna-close" id="snaClose" type="button" aria-label="Dismiss announcement"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <header class="sna-header">
      <nav class="sna-side sna-left" aria-label="Primary"><a href="#shop">Shop</a><a href="#journal">Journal</a><a href="#about">About</a></nav>
      <a class="sna-wordmark" href="#top">Maison Verre</a>
      <nav class="sna-side sna-right" aria-label="Secondary"><a href="#search">Search</a><a href="#account">Account</a><a href="#bag">Bag (0)</a></nav>
    </header>
    <main class="sna-page"><h1>Slow things, made well.</h1><p>Close the announcement bar and the header settles up to the top of the page.</p></main>
  </div>
  <script src="script.js"></script>
</body>
</html>
