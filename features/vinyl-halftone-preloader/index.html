<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Two-Ink Record Gate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="vr-stage" id="vrStage">
    <div class="vr-disc" aria-hidden="true"><div class="vr-label"><span>NOVA<br>QUARTET</span></div></div>
    <div class="vr-right">
      <canvas class="vr-dots" id="vrDots" aria-hidden="true"></canvas>
      <div class="vr-panel">
        <p class="vr-small">Side A / Portfolio</p>
        <h1 class="vr-title">Dropping the needle</h1>
        <ol class="vr-steps" id="vrSteps">
          <li>Dusting the sleeve</li>
          <li>Spinning up the platter</li>
          <li>Finding track one</li>
        </ol>
        <button type="button" class="vr-btn" id="vrGo" disabled>Play the work</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
