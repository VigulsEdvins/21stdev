<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal Globe Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="tg-hero">
    <div class="tg-copy">
      <span class="tg-tag">&gt; system online_</span>
      <h1 class="tg-title">A small world, drawn in plain text</h1>
      <p class="tg-lead">Every character on the globe is picked by depth and light. Drag it to spin, or let it turn on its own.</p>
      <div class="tg-actions">
        <a class="tg-btn" href="#">Open the console</a>
        <span class="tg-status"><i></i> <span id="tgDeg">000</span>&deg; E</span>
      </div>
    </div>
    <div class="tg-view"><canvas id="tgCanvas" class="tg-canvas" aria-label="Rotating wireframe globe made of text characters" role="img"></canvas></div>
  </section>
  <script src="script.js"></script>
</body>
</html>
