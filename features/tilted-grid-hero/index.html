<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curved Gallery Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="cg-hero" aria-labelledby="cgTitle">
    <p class="cg-kicker">Studio reel 2026</p>
    <h1 class="cg-title" id="cgTitle">Frames that bend into focus.</h1>
    <div class="cg-stage" id="cgStage" role="group" aria-label="Gallery of colour studies, drag to scrub">
      <ul class="cg-rail" id="cgRail">
        <li class="cg-card" style="--a:#ff9a5a;--b:#7a2cff;--c:#1b1340"><span>Ember</span></li>
        <li class="cg-card" style="--a:#5ae0c8;--b:#1d6bff;--c:#06162e"><span>Tide</span></li>
        <li class="cg-card" style="--a:#ffe27a;--b:#ff5a7e;--c:#2a0d2b"><span>Dusk</span></li>
        <li class="cg-card" style="--a:#b9ff7a;--b:#14a38a;--c:#04201e"><span>Moss</span></li>
        <li class="cg-card" style="--a:#ffb3e6;--b:#6a5cff;--c:#12103a"><span>Orchid</span></li>
        <li class="cg-card" style="--a:#ffd0a0;--b:#e5483b;--c:#2b0a0a"><span>Clay</span></li>
        <li class="cg-card" style="--a:#9fd8ff;--b:#3a4bd6;--c:#0a0e30"><span>Frost</span></li>
        <li class="cg-card" style="--a:#f4ff9a;--b:#ff8a1f;--c:#2b1503"><span>Solar</span></li>
      </ul>
    </div>
    <p class="cg-intro">Cards swing in along a shallow arc, settle flat at the centre, then tilt away. Drag to scrub.</p>
  </section>
  <script src="script.js"></script>
</body>
</html>
