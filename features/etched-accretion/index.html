<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ember Ring Backdrop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="ea-wrap" id="eaWrap">
    <canvas class="ea-canvas" id="eaCanvas" aria-hidden="true"></canvas>
    <div class="ea-fallback" aria-hidden="true"></div>
    <div class="ea-copy">
      <p class="ea-small">Deep field survey</p>
      <h1 class="ea-title">Light bends around the dark</h1>
      <p class="ea-text">A slowly turning ring of hot ember lines, drawn in a shader, bending the starlight behind it.</p>
      <a class="ea-btn" href="#">Begin the descent</a>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
