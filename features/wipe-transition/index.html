<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Band Wipe Tabs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="wt-wrap">
  <div class="wt-tabs" role="tablist" aria-label="Plans">
    <button class="wt-tab" role="tab" id="wt-t1" aria-controls="wt-panel" aria-selected="true" data-i="0">Overview</button>
    <button class="wt-tab" role="tab" id="wt-t2" aria-controls="wt-panel" aria-selected="false" tabindex="-1" data-i="1">Features</button>
    <button class="wt-tab" role="tab" id="wt-t3" aria-controls="wt-panel" aria-selected="false" tabindex="-1" data-i="2">Pricing</button>
  </div>
  <div class="wt-panel" id="wt-panel" role="tabpanel" aria-labelledby="wt-t1" tabindex="0">
    <div class="wt-content"></div>
    <div class="wt-band" aria-hidden="true"></div>
  </div>
</section>
<script src="script.js"></script>
</body>
</html>
