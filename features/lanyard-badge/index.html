<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swing Badge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="lb-stage" id="lbStage">
    <svg class="lb-strap" id="lbStrap" aria-hidden="true">
      <path id="lbL" class="lb-band" d=""/><path id="lbR" class="lb-band" d=""/>
      <path id="lbS" class="lb-band lb-short" d=""/>
      <rect id="lbBuckle" class="lb-buckle" width="26" height="16" rx="4"/>
    </svg>
    <div class="lb-card" id="lbCard" tabindex="0" role="button" aria-pressed="false" aria-label="Event badge. Drag to swing, press Enter to flip.">
      <span class="lb-hole" aria-hidden="true"></span>
      <div class="lb-flip" id="lbFlip">
        <div class="lb-face lb-front">
          <p class="lb-event">Meridian Dev Days</p>
          <div class="lb-avatar" aria-hidden="true">RA</div>
          <h2 class="lb-name">Rosa Almeida</h2>
          <p class="lb-role">Speaker</p>
          <p class="lb-id">No. 0427 &middot; 12&ndash;14 June</p>
        </div>
        <div class="lb-face lb-back">
          <p class="lb-event">Schedule</p>
          <ul><li><b>09:00</b> Doors open</li><li><b>10:30</b> Opening talk</li><li><b>13:00</b> Lunch</li><li><b>16:00</b> Workshops</li></ul>
          <div class="lb-bars" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <button class="lb-btn" id="lbBtn" type="button">Show back</button>
  </section>
  <script src="script.js"></script>
</body>
</html>
