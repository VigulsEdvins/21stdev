<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-In Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="acl-demo">
  <div class="acl-card">
    <h2 class="acl-title">Welcome back</h2>
    <p class="acl-sub">Sign in to continue to your dashboard.</p>
    <form class="acl-form" novalidate data-edv-form="skip">
      <div class="acl-field"><label>Email</label><input class="acl-input acl-email" type="email" autocomplete="email" required><p class="acl-error acl-email-err" role="alert"></p></div>
      <div class="acl-field"><label>Password</label>
        <div class="acl-pass"><input class="acl-input acl-pass-input" type="password" autocomplete="current-password" required minlength="8"><button class="acl-eye" type="button" aria-pressed="false" aria-label="Show password">Show</button></div>
        <p class="acl-error acl-pass-err" role="alert"></p></div>
      <div class="acl-row"><a class="acl-forgot" href="#forgot">Forgot password?</a></div>
      <button class="acl-btn" type="submit">Sign in</button>
      <p class="acl-status" role="status"></p>
    </form>
    <p class="acl-switch"><span>New here?</span> <button class="acl-link" type="button">Create an account</button></p>
  </div>
</section>
  <script src="script.js"></script>
</body>
</html>
