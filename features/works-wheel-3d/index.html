<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works Wheel 3D Ring-to-Drum Index</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="ww-section" id="works-wheel-section" aria-label="Works '26">
    <div class="ww-stage" id="ww-stage" tabindex="0" role="listbox" aria-label="Works '26">
      <div class="ww-wheel" id="ww-wheel"></div>
    </div>
    <div class="ww-ring-label" id="ww-ring-label">Works '26</div>
    <div class="ww-front-title" id="ww-front-title"></div>
    <ol class="ww-index" id="ww-index"></ol>
    <div class="ww-hint">Scroll, drag vertically, or click index on the right to unfold the 3D drum</div>
  </section>
  <script src="script.js"></script>
</body>
</html>
