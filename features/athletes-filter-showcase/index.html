<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filterable Roster & Portrait Hover Showcase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="ath-section" id="athletes">
    <div class="ath-top">
      <h2 class="ath-heading">TALENT &amp; <span>ROSTER</span></h2>
      <div class="ath-tabs" role="tablist">
        <button type="button" class="athletes-tab-btn" role="tab" aria-selected="true" data-filter="all">All Talent (8)</button>
        <button type="button" class="athletes-tab-btn" role="tab" aria-selected="false" data-filter="exclusive">Exclusive (4)</button>
        <button type="button" class="athletes-tab-btn" role="tab" aria-selected="false" data-filter="creative">Creators (2)</button>
      </div>
    </div>
    <div class="ath-grid" id="athletes-rail"></div>
  </section>
  <script src="script.js"></script>
</body>
</html>
