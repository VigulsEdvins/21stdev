<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Corridor Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="cc-hero" id="ccHero">
    <div class="cc-field" id="ccField" aria-hidden="true"></div>
    <div class="cc-copy">
      <span class="cc-pill">New: live boards</span>
      <h1 class="cc-title">Ideas move faster when they can be seen.</h1>
      <p class="cc-text">Collect references, drop them on a shared wall and watch the whole project flow past you.</p>
      <div class="cc-actions">
        <button type="button" class="cc-btn cc-ghost">Watch a demo</button>
        <button type="button" class="cc-btn cc-solid">Start a board</button>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
