<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stagger Testimonials</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div class="stagger-stage">
    <!-- Header Controls -->
    <div class="stagger-controls">
      <button type="button" class="theme-btn" id="btnThemeToggle">Toggle Theme</button>
      <button type="button" class="filter-btn active" data-filter="all">All Reviews</button>
      <button type="button" class="filter-btn" data-filter="leadership">Leadership</button>
      <button type="button" class="filter-btn" data-filter="engineering">Engineering</button>
    </div>

    <!-- Title Section -->
    <header class="stagger-header">
      <span class="proof-pill">Social Proof</span>
      <h2 class="stagger-title">Loved by builders worldwide</h2>
      <p class="stagger-sub">
        Real feedback from designers, founders, and engineering leaders who moved away from boring quote boxes.
      </p>
    </header>

    <!-- Staggered Cards Grid -->
    <div class="stagger-grid" id="staggerGrid">
      <!-- Injected via script.js -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
