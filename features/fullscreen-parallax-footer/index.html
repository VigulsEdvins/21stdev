<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Screen Parallax Footer Reveal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <footer class="edv-footer" id="edvFooter">
    <div class="footer-top-meta">
      <span>NORTHPORT &bull; LAKESIDE &bull; EASTVALE</span>
      <span>HOVER LINKS TO PREVIEW STUDIOS</span>
    </div>

    <nav class="footer-nav" id="footerNav">
      <a href="#" class="footer-link" data-bg="#1a1423" data-accent="#eab676" data-city="12 Example Street, Northport">
        <span class="link-index">01</span>
        <span class="link-label">Northport <em>Headquarters</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
      <a href="#" class="footer-link" data-bg="#0f2027" data-accent="#7bdff2" data-city="48 Sample Avenue, Lakeside">
        <span class="link-index">02</span>
        <span class="link-label">Lakeside <em>Representation</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
      <a href="#" class="footer-link" data-bg="#2b1911" data-accent="#f4a261" data-city="7 Placeholder Road, Eastvale">
        <span class="link-index">03</span>
        <span class="link-label">Eastvale <em>Syndication</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
      <a href="#" class="footer-link" data-bg="#132a13" data-accent="#ecf39e" data-city="Private Monograph &amp; Print Vault">
        <span class="link-index">04</span>
        <span class="link-label">Monograph <em>Editions</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
    </nav>

    <div class="floating-card" id="floatingCard">
      <div class="floating-art" id="floatingArt"></div>
      <div class="floating-caption" id="floatingCaption">Northport Studio</div>
    </div>

    <div class="footer-bottom-meta">
      <span>&copy; 2026 EDVLABS</span>
      <span>BACK TO TOP &uarr;</span>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
