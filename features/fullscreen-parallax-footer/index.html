<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Screen Parallax Footer Reveal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <footer class="viv-footer" id="vivFooter">
    <div class="footer-top-meta">
      <span>PARIS &bull; NEW YORK &bull; MILAN</span>
      <span>HOVER LINKS TO PREVIEW STUDIOS</span>
    </div>

    <nav class="footer-nav" id="footerNav">
      <a href="#paris" class="footer-link" data-bg="#1a1423" data-accent="#eab676" data-city="24 Rue du Sentier, 75002 Paris">
        <span class="link-index">01</span>
        <span class="link-label">Paris <em>Headquarters</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
      <a href="#newyork" class="footer-link" data-bg="#0f2027" data-accent="#7bdff2" data-city="450 Broadway, SoHo NY 10013">
        <span class="link-index">02</span>
        <span class="link-label">New York <em>Representation</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
      <a href="#milan" class="footer-link" data-bg="#2b1911" data-accent="#f4a261" data-city="Via Solferino 18, 20121 Milano">
        <span class="link-index">03</span>
        <span class="link-label">Milan <em>Syndication</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
      <a href="#archive" class="footer-link" data-bg="#132a13" data-accent="#ecf39e" data-city="Private Monograph &amp; Print Vault">
        <span class="link-index">04</span>
        <span class="link-label">Monograph <em>Editions</em></span>
        <span class="link-arrow">&nearr;</span>
      </a>
    </nav>

    <div class="floating-card" id="floatingCard">
      <div class="floating-art" id="floatingArt"></div>
      <div class="floating-caption" id="floatingCaption">Paris Studio</div>
    </div>

    <div class="footer-bottom-meta">
      <span>&copy; 2026 VIVMGMT SYNDICATION</span>
      <span>BACK TO TOP &uarr;</span>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
