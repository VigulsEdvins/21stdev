<section class="lsih-section">
  <div class="lsih-container">
    <div class="lsih-card">
      <div class="lsih-info">
        <span class="lsih-eyebrow">Direct Consultation</span>
        <h2 class="lsih-title">Request a Site Survey</h2>
        <p class="lsih-desc">
          Connect directly with our land and forestry specialists. We evaluate site access, timber value, and operational schedules.
        </p>
        <div class="lsih-channels">
          <div class="lsih-channel">
            <span class="lsih-ch-icon">📞</span>
            <div>
              <div class="lsih-ch-label">Direct Hotline</div>
              <a href="tel:07940232830" class="lsih-ch-val">07940 232830</a>
            </div>
          </div>
          <div class="lsih-channel">
            <span class="lsih-ch-icon">✉️</span>
            <div>
              <div class="lsih-ch-label">Email Inquiries</div>
              <a href="mailto:forest@edvlabs.com" class="lsih-ch-val">forest@edvlabs.com</a>
            </div>
          </div>
        </div>
      </div>

      <div class="lsih-form-wrap">
        <form class="lsih-form" novalidate>
          <div class="lsih-grid">
            <div class="lsih-field">
              <label class="lsih-label">Full Name *</label>
              <input type="text" class="lsih-input" name="name" required placeholder="John Stewart">
            </div>
            <div class="lsih-field">
              <label class="lsih-label">Phone Number *</label>
              <input type="tel" class="lsih-input" name="phone" required placeholder="07940 123456">
            </div>
            <div class="lsih-field lsih-full">
              <label class="lsih-label">Email Address *</label>
              <input type="email" class="lsih-input" name="email" required placeholder="john@estate.co.uk">
            </div>
            <div class="lsih-field lsih-full">
              <label class="lsih-label">Location / Acreage</label>
              <input type="text" class="lsih-input" name="location" placeholder="e.g. Aberdeenshire, 15 hectares">
            </div>
            <div class="lsih-field lsih-full">
              <label class="lsih-label">Project Details</label>
              <textarea class="lsih-textarea" name="details" rows="3" placeholder="Brief scope of works..."></textarea>
            </div>
          </div>
          <div class="lsih-feedback" role="alert"></div>
          <button type="submit" class="lsih-submit">Submit Survey Request</button>
        </form>
      </div>
    </div>
  </div>
</section>
