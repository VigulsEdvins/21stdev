<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKLCH Ambient Aurora Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="aurora-hero" id="auroraHero">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
    <div class="hero-grid-lines"></div>

    <div class="hero-content">
      <div class="hero-pill">
        <span class="pulse-dot"></span>
        <span>WIDE-GAMUT OKLCH ENGINE</span>
      </div>

      <h1 class="hero-title">
        Ship interfaces with<br />
        <span class="gradient-span">perceptual depth.</span>
      </h1>

      <p class="hero-sub">
        Interactive OKLCH radial shaders respond to cursor coordinates and chroma presets without muddying midtones.
      </p>

      <div class="preset-chips" id="presetChips">
        <button class="chip is-active" data-h1="275" data-h2="320" data-h3="200">Ultraviolet</button>
        <button class="chip" data-h1="155" data-h2="195" data-h3="120">Emerald Cyber</button>
        <button class="chip" data-h1="35" data-h2="12" data-h3="300">Solar Flare</button>
        <button class="chip" data-h1="230" data-h2="260" data-h3="185">Deep Cryo</button>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
