<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Waitlist Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="ow-hero">
    <div class="ow-orbits" aria-hidden="true">
      <span class="ow-ring r1"><i></i></span>
      <span class="ow-ring r2"><i></i></span>
      <span class="ow-ring r3"><i></i></span>
    </div>

    <div class="ow-inner">
      <span class="ow-pill"><b></b> Early access is open</span>
      <h1 class="ow-title">Be first in line when we open the doors</h1>
      <p class="ow-lead">Leave your email and we will send one note on launch day. No spam, and you can leave any time.</p>

      <form class="ow-form" id="owForm" novalidate data-edv-form="message">
        <label class="ow-sr" for="owEmail">Email address</label>
        <input id="owEmail" class="ow-input" type="email" placeholder="you@example.com" autocomplete="email" required />
        <button type="submit" class="ow-btn">Join the list</button>
      </form>
      <p class="ow-msg" id="owMsg" role="status" aria-live="polite"></p>

      <div class="ow-proof">
        <span class="ow-stack"><i>A</i><i>B</i><i>C</i><i>D</i></span>
        <span><strong id="owCount">1,284</strong> people already waiting</span>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
