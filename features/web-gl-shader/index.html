<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromatic Ripple Field</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="cr-stage" id="crStage">
    <canvas class="cr-canvas" id="crCanvas" aria-hidden="true"></canvas>
    <div class="cr-copy">
      <h1 class="cr-title">Ripples with a colour split</h1>
      <p class="cr-lead">Rings spread from your pointer and the red, green and blue channels drift apart as they travel.</p>
      <p class="cr-readout" id="crReadout">x 0.50 &middot; y 0.50</p>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
