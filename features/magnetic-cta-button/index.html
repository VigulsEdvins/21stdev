<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnetic Call-To-Action Button</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="mcb-demo">
    <p class="mcb-eyebrow">Ready when you are</p>
    <h2 class="mcb-title">Start your first project</h2>
    <div class="mcb-zone">
      <a class="mcb-button" href="#start">
        <span class="mcb-ripple-layer" aria-hidden="true"></span>
        <span class="mcb-label"><span class="mcb-label-a">Get started</span><span class="mcb-label-b" aria-hidden="true">Let's go</span></span>
        <svg class="mcb-arrow" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
    <p class="mcb-note">No card needed. Cancel any time.</p>
  </section>
  <script src="script.js"></script>
</body>
</html>
