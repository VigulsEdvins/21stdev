<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iridescent Liquid-Metal Shader Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="shader-stage">
    <div class="metal-card" id="metalCard">
      <canvas id="metalCanvas" width="360" height="220"></canvas>
      <div class="metal-overlay">
        <div class="metal-top">
          <span class="metal-chip">CHROMATIC SHADER // V2</span>
          <span class="metal-id">#0021</span>
        </div>
        <div class="metal-bottom">
          <h2>Liquid Chrome Surface</h2>
          <p>Move cursor across card to bend interference fringes</p>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
