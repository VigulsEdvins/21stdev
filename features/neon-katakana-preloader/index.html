<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Shutter Gate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="ns-root" id="nsRoot" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <section class="ns-behind">
      <canvas id="nsRain" aria-hidden="true"></canvas>
      <div class="ns-ready"><p>system ready</p><button class="ns-again" id="nsAgain" type="button" tabindex="-1">Run again</button></div>
    </section>
    <div class="ns-door ns-top"><div class="ns-slats"></div></div>
    <div class="ns-door ns-bot"><div class="ns-slats"></div></div>
    <div class="ns-sign">
      <div class="ns-word" id="nsWord" aria-hidden="true">ゲート</div>
      <p class="ns-sub">gate / loading</p>
      <div class="ns-count" id="nsCount">00</div>
      <div class="ns-bar"><span id="nsBar"></span></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
