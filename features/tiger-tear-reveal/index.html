<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Tear Reveal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tr-track">
  <div class="tr-sticky">
    <div class="tr-under">
      <p class="tr-small">Behind the sheet</p>
      <h2 class="tr-reveal">Made loud,<br>kept honest.</h2>
      <a class="tr-btn" href="#">Explore the studio</a>
    </div>
    <div class="tr-half tr-top"><div class="tr-poster"><p class="tr-tag">Poster no. 12</p><h1 class="tr-word">LOUD</h1></div></div>
    <div class="tr-half tr-bot"><div class="tr-poster"><p class="tr-tag">Poster no. 12</p><h1 class="tr-word" aria-hidden="true">LOUD</h1></div></div>
    <p class="tr-cue">Scroll to tear</p>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
