<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editorial 3x3 Interactive Hover Grid</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="hover-grid-wrapper">
    <!-- Floating Center Headline Overlay -->
    <div class="center-headline-zone" id="centerHeadlineZone">
      <h1 class="center-title" id="centerTitle">Margarita Vigule</h1>
      <span class="hover-badge" id="hoverBadge">PHOTOGRAPHY ARCHIVE &bull; 2026</span>
    </div>

    <!-- Scattered Multi-Image Stage (triggered by active cell hover) -->
    <div class="hover-stage-container" id="hoverStage" aria-hidden="true"></div>

    <!-- 3x3 Grid Layout -->
    <div class="grid-3x3" id="grid3x3">
      <!-- Row 1 -->
      <div class="grid-cell" data-key="sports" data-title="Patrick Mahomes" data-tag="SPORTS ACTION" data-url="/mom/work.html?tag=sports" data-images="/assets/library/patrick-mahomes-thumb-4ce12ce7.png,/assets/library/patrick-mahomes-mesh-1-b5630223.png,/assets/library/patrick-mahomes-mesh-2-611b9559.png">
        <span class="cell-idx">01</span>
        <span class="cell-label">Sports</span>
      </div>
      <div class="grid-cell" data-key="craft" data-title="La Marzocco Craft" data-tag="COMMERCIAL ARCHIVE" data-url="/mom/work.html?tag=craft" data-images="/assets/library/la-marzocco-thumb-a0214898.png,/assets/library/la-marzocco-mesh-1-8fcb71a2.png,/assets/library/la-marzocco-mesh-2-46744219.png">
        <span class="cell-idx">02</span>
        <span class="cell-label">Craft</span>
      </div>
      <div class="grid-cell" data-key="aero" data-title="Air Space Intelligence" data-tag="AEROSPACE MONOGRAPH" data-url="/mom/work.html?tag=aero" data-images="/assets/library/air-space-intelligence-thumb-0f3ac386.png,/assets/library/air-space-intelligence-mesh-1-b15a18b9.png,/assets/library/air-space-intelligence-mesh-2-67db35cf.png">
        <span class="cell-idx">03</span>
        <span class="cell-label">Aerospace</span>
      </div>

      <!-- Row 2 -->
      <div class="grid-cell" data-key="editorial" data-title="Applause Monolith" data-tag="EDITORIAL SERIES" data-url="/mom/work.html?tag=editorial" data-images="/assets/library/applause-thumb-ae19f430.png,/assets/library/applause-mesh-1-2b2e4eb0.png,/assets/library/applause-mesh-2-e85b57a1.png">
        <span class="cell-idx">04</span>
        <span class="cell-label">Editorial</span>
      </div>
      <div class="grid-cell center-neutral" id="centerCell">
        <div class="pulse-ring"></div>
      </div>
      <div class="grid-cell" data-key="street" data-title="Bad Boys Cinema" data-tag="CINEMATIC STREET" data-url="/mom/work.html?tag=street" data-images="/assets/library/bad-boys-thumb-6bf21a1e.png,/assets/library/bad-boys-mesh-1-7c1d1043.png,/assets/library/bad-boys-mesh-2-9bc847e5.png">
        <span class="cell-idx">06</span>
        <span class="cell-label">Street</span>
      </div>

      <!-- Row 3 -->
      <div class="grid-cell" data-key="motion" data-title="0G Spatial Motion" data-tag="GRAVITY EXPERIMENTAL" data-url="/mom/work.html?tag=motion" data-images="/assets/library/0g-thumb-3ba91606.png,/assets/library/0g-mesh-1-f88940d8.png,/assets/library/0g-mesh-2-02264736.png">
        <span class="cell-idx">07</span>
        <span class="cell-label">Motion</span>
      </div>
      <div class="grid-cell" data-key="portrait" data-title="Margarita Studio" data-tag="PORTRAIT MONOGRAPH" data-url="/mom/work.html?tag=portrait" data-images="/assets/library/margarita-vigule-0213f7e4.png,/assets/library/iyo-thumb-41d5f334.png,/assets/library/iyo-mesh-1-8e9ed275.png">
        <span class="cell-idx">08</span>
        <span class="cell-label">Portraits</span>
      </div>
      <div class="grid-cell" data-key="culture" data-title="Pelé Heritage" data-tag="CULTURAL LEGACY" data-url="/mom/work.html?tag=culture" data-images="/assets/library/pele-foundation-thumb-c189a772.png,/assets/library/pele-foundation-mesh-1-bde5ac02.png,/assets/library/pele-foundation-mesh-2-780a5c4e.png">
        <span class="cell-idx">09</span>
        <span class="cell-label">Heritage</span>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
