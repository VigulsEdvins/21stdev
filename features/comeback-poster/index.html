<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meadow Gig Poster</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="cp-poster" id="cpPoster">
    <canvas class="cp-field" id="cpField" aria-hidden="true"></canvas>
    <div class="cp-sky" aria-hidden="true"></div>

    <header class="cp-paper">
      <p class="cp-small">Live in the long grass &middot; One night only</p>
      <h1 class="cp-title">Bright Return</h1>
      <ul class="cp-words" aria-label="Themes">
        <li>Hush</li><li>Bloom</li><li>Embers</li><li>静</li>
        <li>Salt</li><li>Echo</li><li>Dusk</li><li>Again</li>
      </ul>
      <div class="cp-row"><span class="cp-date">09 . 20 . 26</span><a class="cp-btn" href="#">Tickets</a></div>
    </header>

    <svg class="cp-figure" id="cpFigure" viewBox="0 0 200 360" role="img" aria-label="A hooded figure in a white robe, face turned toward you">
      <defs>
        <linearGradient id="cpRobe" x1="0" x2="1"><stop offset="0" stop-color="#d9d3c8"/><stop offset=".5" stop-color="#fffdf7"/><stop offset="1" stop-color="#cfc8bb"/></linearGradient>
        <radialGradient id="cpVoid" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#050505"/><stop offset="1" stop-color="#2a2622"/></radialGradient>
      </defs>
      <path d="M100 20c-38 0-62 28-62 66 0 16 4 28 8 40-24 30-38 90-42 234h192c-4-144-18-204-42-234 4-12 8-24 8-40 0-38-24-66-62-66z" fill="url(#cpRobe)"/>
      <path d="M60 330c10-70 20-140 40-190 20 50 30 120 40 190" fill="none" stroke="#b7b0a2" stroke-width="2" opacity=".6"/>
      <g id="cpFace">
        <ellipse cx="100" cy="88" rx="30" ry="40" fill="url(#cpVoid)"/>
        <ellipse id="cpGlint" cx="100" cy="76" rx="4" ry="10" fill="#fff" opacity=".12"/>
      </g>
    </svg>
  </section>
  <script src="script.js"></script>
</body>
</html>
