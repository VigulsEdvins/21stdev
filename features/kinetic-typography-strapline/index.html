<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetic Editorial Strapline Scrub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="strapline-stage">
    <div class="strapline-meta">
      <span>KINETIC MANIFESTO // SCROLL WHEEL OR DRAG SLIDER</span>
      <span id="progressReadout">68%</span>
    </div>

    <p class="strapline-copy" id="straplineCopy"></p>

    <div class="strapline-controls">
      <input type="range" id="wordScrubber" min="0" max="100" value="68" aria-label="Word reveal progress" />
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
