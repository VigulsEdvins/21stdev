<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Shrinking Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ssh-demo">
    <header class="ssh-header" id="sshHeader">
      <div class="ssh-bar">
        <a class="ssh-logo" href="#top" aria-label="Northwind home"><span class="ssh-mark" aria-hidden="true"></span>Northwind</a>
        <nav class="ssh-nav" id="sshNav" aria-label="Main">
          <a href="#product">Product</a><a href="#pricing">Pricing</a><a href="#customers">Customers</a><a href="#docs">Docs</a>
        </nav>
        <a class="ssh-cta" href="#start">Start free</a>
        <button class="ssh-burger" id="sshBurger" type="button" aria-expanded="false" aria-controls="sshNav" aria-label="Menu"><span></span><span></span></button>
      </div>
    </header>
    <main class="ssh-page">
      <h1>Scroll the page</h1>
      <p>The header is 88px tall at the top and settles to 56px with a frosted background once you scroll past 40px.</p>
      <div class="ssh-spacer" aria-hidden="true"></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
