<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form With Validation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="cfv-demo">
  <div class="cfv-card">
    <h2 class="cfv-title">Get in touch</h2>
    <p class="cfv-sub">Tell us a little about your project and we will reply within one working day.</p>
    <form class="cfv-form" action="" method="post" novalidate data-edv-form="message">
      <div class="cfv-field"><label>Your name</label><input class="cfv-input" data-rule="name" name="name" type="text" autocomplete="name" required><p class="cfv-error" role="alert"></p></div>
      <div class="cfv-field"><label>Email address</label><input class="cfv-input" data-rule="email" name="email" type="email" autocomplete="email" required><p class="cfv-error" role="alert"></p></div>
      <div class="cfv-field"><label>Message</label><textarea class="cfv-input" data-rule="msg" name="message" rows="5" required minlength="10"></textarea><p class="cfv-error" role="alert"></p></div>
      <button class="cfv-btn" type="submit">Send message</button>
    </form>
    <div class="cfv-success" role="status" hidden><p class="cfv-success-text">Thank you! Your message is on its way.</p></div>
  </div>
</section>
  <script src="script.js"></script>
</body>
</html>
