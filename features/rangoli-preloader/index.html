<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Powder Pattern Loader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="rp-floor" id="rpFloor" role="status" aria-live="polite" aria-label="Loading">
    <canvas class="rp-canvas" id="rpCanvas" aria-hidden="true"></canvas>
    <p class="rp-caption"><span class="rp-label">Pouring colour</span> <b class="rp-pct" id="rpPct">0%</b></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
