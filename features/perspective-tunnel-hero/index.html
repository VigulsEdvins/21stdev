<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warp Corridor Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="wc-hero" id="wcHero" data-scroll-pin>
    <div class="wc-sticky" id="wcSticky">
      <div class="wc-scene" id="wcScene" aria-hidden="true"></div>
      <div class="wc-glow" aria-hidden="true"></div>
      <div class="wc-copy">
        <p class="wc-label">Scroll to travel</p>
        <h1 class="wc-title">Fly through everything you have made</h1>
        <p class="wc-sub">A corridor of work rushes toward you as you scroll. Move the pointer to lean into the turn.</p>
        <div class="wc-actions">
          <a class="wc-btn wc-solid" href="#">Start exploring</a>
          <a class="wc-btn wc-line" href="#">Read the story</a>
        </div>
      </div>
      <div class="wc-meter" aria-hidden="true"><i id="wcMeter"></i></div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
