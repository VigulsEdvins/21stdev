<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizontal Inertia Drag Timeline & Mechanical Tick Ruler</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="tl-root">
    <header class="tl-top">
      <span>BETTER OFF® // ARCHIVE TIMELINE</span>
      <span id="brand-row-3">(BO®S/OCTOBER '26)</span>
      <span>DRAG OR SCROLL HORIZONTALLY</span>
    </header>

    <div class="tl-viewport" id="timeline-viewport">
      <div class="tl-track" id="timeline-track"></div>
    </div>

    <footer class="tl-ruler-wrap" id="timeline-ruler-wrapper">
      <div class="ruler-ticks" id="timeline-ruler-ticks"></div>
      <div class="ruler-months" id="timeline-ruler-months"></div>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
