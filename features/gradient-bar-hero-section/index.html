<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rising Bars Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="rb-hero">
    <div class="rb-bars" id="rbBars" aria-hidden="true"></div>
    <div class="rb-fade" aria-hidden="true"></div>

    <nav class="rb-nav">
      <span class="rb-logo">edvlabs</span>
      <span class="rb-links"><a href="#">Product</a><a href="#">Pricing</a><a href="#">Contact</a></span>
      <a class="rb-nav-cta" href="#">Sign in</a>
    </nav>

    <div class="rb-copy">
      <span class="rb-badge"><b id="rbCount">0</b> teams joined this week</span>
      <h1 class="rb-title">Build calm, fast pages without the busywork</h1>
      <p class="rb-lead">Compose a full page from ready-made sections, match it to your brand and export clean code.</p>
      <div class="rb-actions">
        <a class="rb-btn rb-primary" href="#">Start for free</a>
        <a class="rb-btn rb-ghost" href="#">See how it works</a>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
