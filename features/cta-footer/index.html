<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call-To-Action Footer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<footer class="ctf-demo">
  <div class="ctf-cta">
    <h2 class="ctf-title">Let's build something great together</h2>
    <p class="ctf-text">Leave your email and we will send a short note on how we can help.</p>
    <form class="ctf-form" id="ctfForm" novalidate>
      <label class="ctf-sr" for="ctfEmail">Email address</label>
      <input class="ctf-input" id="ctfEmail" type="email" placeholder="you@company.com" autocomplete="email" aria-describedby="ctfMsg">
      <button class="ctf-btn" type="submit">Get in touch</button>
    </form>
    <p class="ctf-msg" id="ctfMsg" role="status"></p>
  </div>
  <div class="ctf-links">
    <nav aria-label="Company"><h3>Company</h3><a href="#about">About</a><a href="#careers">Careers</a><a href="#press">Press</a></nav>
    <nav aria-label="Product"><h3>Product</h3><a href="#features">Features</a><a href="#pricing">Pricing</a><a href="#changelog">Changelog</a></nav>
    <nav aria-label="Support"><h3>Support</h3><a href="#help">Help centre</a><a href="#contact">Contact</a><a href="#status">Status</a></nav>
  </div>
  <p class="ctf-copy">&copy; 2026 Northwind Studio. All rights reserved.</p>
</footer>
  <script src="script.js"></script>
</body>
</html>
