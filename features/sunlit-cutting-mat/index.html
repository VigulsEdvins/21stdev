<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Window Light Desk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="sl-stage" id="slStage">
    <canvas class="sl-cv" id="slCv" role="img" aria-label="Warm window light with leaf shadows drifting across a dark blue desk mat"></canvas>
    <div class="sl-cap">
      <p class="sl-label">Afternoon, 4:10</p>
      <h1 class="sl-title">Window light on the desk</h1>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
