<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Comparison Matrix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="pm-demo">
    <header class="pm-head">
      <h2 class="pm-title">Compare the plans</h2>
      <p class="pm-sub">Every plan includes the basics. Pick a column to highlight it.</p>
    </header>
    <div class="pm-scroll">
      <table class="pm-table">
        <thead>
          <tr>
            <th scope="col"><span class="pm-sr">Feature</span></th>
            <th scope="col"><button type="button" class="pm-col" data-col="1">Solo<small>$9 / month</small></button></th>
            <th scope="col"><button type="button" class="pm-col is-on" data-col="2">Team<small>$29 / month</small></button></th>
            <th scope="col"><button type="button" class="pm-col" data-col="3">Studio<small>$79 / month</small></button></th>
          </tr>
        </thead>
        <tbody>
          <tr><th scope="row">Projects</th><td data-col="1">3</td><td data-col="2" class="is-on">25</td><td data-col="3">Unlimited</td></tr>
          <tr><th scope="row">Team seats</th><td data-col="1">1</td><td data-col="2" class="is-on">5</td><td data-col="3">20</td></tr>
          <tr><th scope="row">Storage</th><td data-col="1">5 GB</td><td data-col="2" class="is-on">50 GB</td><td data-col="3">500 GB</td></tr>
          <tr><th scope="row">Custom domain</th><td data-col="1"><span class="pm-no">No</span></td><td data-col="2" class="is-on"><span class="pm-yes">Yes</span></td><td data-col="3"><span class="pm-yes">Yes</span></td></tr>
          <tr><th scope="row">Priority support</th><td data-col="1"><span class="pm-no">No</span></td><td data-col="2" class="is-on"><span class="pm-no">No</span></td><td data-col="3"><span class="pm-yes">Yes</span></td></tr>
        </tbody>
      </table>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
