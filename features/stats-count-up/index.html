<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats Count-Up Row</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="scu-demo" aria-labelledby="scuTitle">
  <h2 class="scu-title" id="scuTitle">Trusted by teams everywhere</h2>
  <ul class="scu-row">
    <li class="scu-item"><p class="scu-num"><span class="scu-value" data-to="12000" data-suffix="+">12,000+</span></p><p class="scu-label">Active teams</p></li>
    <li class="scu-item"><p class="scu-num"><span class="scu-value" data-to="99.9" data-decimals="1" data-suffix="%">99.9%</span></p><p class="scu-label">Uptime last year</p></li>
    <li class="scu-item"><p class="scu-num"><span class="scu-value" data-to="48" data-suffix="">48</span></p><p class="scu-label">Countries</p></li>
    <li class="scu-item"><p class="scu-num"><span class="scu-value" data-to="4.9" data-decimals="1" data-suffix="/5">4.9/5</span></p><p class="scu-label">Average rating</p></li>
  </ul>
</section>
  <script src="script.js"></script>
</body>
</html>
