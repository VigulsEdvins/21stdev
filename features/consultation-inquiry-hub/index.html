<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation Inquiry Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="cih-section">
    <div class="cih-container">
      <div class="cih-header">
        <span class="cih-badge">Free Consultation</span>
        <h2 class="cih-title">We'd Love to Hear From You</h2>
        <p class="cih-desc">Tell us about your project or architecture challenge. Our lead engineers will respond within 24 hours.</p>
      </div>

      <div class="cih-body">
        <div class="cih-channels-col">
          <div class="cih-channel-card">
            <div class="cih-icon">💬</div>
            <div>
              <span class="cih-label">Chat With Us</span>
              <a href="mailto:solutions@edvlabs.com" class="cih-val">solutions@edvlabs.com</a>
            </div>
          </div>

          <div class="cih-channel-card">
            <div class="cih-icon">📞</div>
            <div>
              <span class="cih-label">Call 24/7 Global Desk</span>
              <a href="tel:+15185643200" class="cih-val">+1 (518) 564-3200</a>
            </div>
          </div>

          <div class="cih-channel-card">
            <div class="cih-icon">📍</div>
            <div>
              <span class="cih-label">Visit Innovation Campus</span>
              <span class="cih-val">Silicon Quarter, Harbourside</span>
            </div>
          </div>
        </div>

        <div class="cih-form-col">
          <form class="cih-form" id="cih-inquiry-form">
            <div class="cih-form-row">
              <div class="cih-field">
                <label for="cih-name">Full Name *</label>
                <input type="text" id="cih-name" required placeholder="Alex Turner" />
              </div>
              <div class="cih-field">
                <label for="cih-email">Work Email *</label>
                <input type="email" id="cih-email" required placeholder="alex@company.com" />
              </div>
            </div>

            <div class="cih-form-row">
              <div class="cih-field">
                <label for="cih-subject">Subject</label>
                <select id="cih-subject">
                  <option value="Product Development">Product Development</option>
                  <option value="Cloud & DevOps">Cloud &amp; DevOps</option>
                  <option value="AI & Automation">AI &amp; Automation</option>
                  <option value="UI/UX Architecture">UI/UX Architecture</option>
                </select>
              </div>
              <div class="cih-field">
                <label for="cih-budget">Estimated Budget</label>
                <select id="cih-budget">
                  <option value="$25k - $50k">$25k - $50k</option>
                  <option value="$50k - $100k">$50k - $100k</option>
                  <option value="$100k+">$100k+</option>
                </select>
              </div>
            </div>

            <div class="cih-field">
              <label for="cih-message">Project Scope / Challenge *</label>
              <textarea id="cih-message" rows="4" required placeholder="Describe your objectives, current architecture, and timeline..."></textarea>
            </div>

            <div class="cih-consent">
              <label>
                <input type="checkbox" id="cih-consent" checked />
                <span>I accept the privacy policy and consent to receiving a technical proposal.</span>
              </label>
            </div>

            <button type="submit" class="cih-submit-btn">Send Consultation Inquiry →</button>
            <div class="cih-status" id="cih-status" style="display: none;"></div>
          </form>
        </div>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
