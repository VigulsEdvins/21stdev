<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Drop Zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<section class="fdz-demo">
  <div class="fdz-wrap">
    <h2 class="fdz-title">Attach your files</h2>
    <div class="fdz-zone">
      <p class="fdz-zone-text">Drag files here, or</p>
      <button class="fdz-browse" type="button">Browse files</button>
      <input class="fdz-native" type="file" multiple accept="image/*,.pdf" aria-label="Choose files">
      <p class="fdz-hint">Images or PDF, up to 5 MB each.</p>
    </div>
    <p class="fdz-msg" role="status" aria-live="polite"></p>
    <ul class="fdz-files"></ul>
  </div>
</section>
  <script src="script.js"></script>
</body>
</html>
