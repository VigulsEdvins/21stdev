<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stirred Water</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="cw-pool" id="cwPool" aria-label="Interactive water surface">
    <canvas class="cw-canvas" id="cwCanvas" aria-hidden="true"></canvas>
    <p class="cw-label">Drag across the water</p>
    <button class="cw-drop" id="cwDrop" type="button">Drop a pebble</button>
  </section>
  <script src="script.js"></script>
</body>
</html>
