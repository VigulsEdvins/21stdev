<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Logo Header</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="clh-demo">
  <header class="clh-header">
    <div class="clh-bar">
      <nav class="clh-left clh-nav" aria-label="Primary"><a href="#shop">Shop</a><a href="#journal">Journal</a></nav>
      <a class="clh-logo" href="#top" aria-label="Atelier home">Atelier</a>
      <nav class="clh-right clh-nav" aria-label="Secondary"><a href="#about">About</a><a href="#contact">Contact</a></nav>
      <button class="clh-burger" type="button" aria-expanded="false" aria-label="Menu"><span></span><span></span></button>
    </div>
    <nav class="clh-mobile" aria-label="Mobile" hidden><a href="#shop">Shop</a><a href="#journal">Journal</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
  </header>
</div>
  <script src="script.js"></script>
</body>
</html>
