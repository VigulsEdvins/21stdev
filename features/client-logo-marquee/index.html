<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Dual-Direction Partner Logo Marquee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="marquee-section">
    <div class="marquee-header">
      <span class="marquee-label">Trusted by Global Clubs, Federations &amp; Brands</span>
      <button type="button" class="marquee-btn" id="speed-toggle">Speed: Normal (1x)</button>
    </div>
    <div class="clients-marquee" id="marquee-row-1">
      <div class="clients-marquee__group">
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#ef4444"></span><span>AFC AJAX</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#3b82f6"></span><span>CLUB BRUGGE</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#0ea5e9"></span><span>COMO 1907</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#eab308"></span><span>DAZN BROADCAST</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#38bdf8"></span><span>HOKA PERFORMANCE</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#10b981"></span><span>ADIDAS ORIGINALS</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#f97316"></span><span>BELGIAN RED DEVILS</span></div>
      </div>
    </div>
    <div class="clients-marquee clients-marquee--reverse" id="marquee-row-2">
      <div class="clients-marquee__group">
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#f43f5e"></span><span>ROYAL ANTWERP FC</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#a855f7"></span><span>DPG MEDIA</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#6366f1"></span><span>BNXT LEAGUE</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#22c55e"></span><span>VFL WOLFSBURG</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#f59e0b"></span><span>AL QADSIAH FC</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#14b8a6"></span><span>PLAY SPORTS</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#ec4899"></span><span>JOUER STUDIO</span></div>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
