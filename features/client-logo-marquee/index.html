<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Dual-Direction Partner Logo Marquee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="marquee-section">
    <div class="marquee-header">
      <span class="marquee-label">Trusted by Global Clubs, Federations &amp; Brands</span>
      <button type="button" class="marquee-btn" id="speed-toggle">Speed: Normal (1x)</button>
    </div>
    <div class="clients-marquee" id="marquee-row-1"></div>
    <div class="clients-marquee clients-marquee--reverse" id="marquee-row-2"></div>
  </section>
  <script src="script.js"></script>
</body>
</html>
