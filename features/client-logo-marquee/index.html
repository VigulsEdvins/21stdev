<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Dual-Direction Partner Logo Marquee</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="marquee-section">
    <div class="marquee-header">
      <span class="marquee-label">Trusted by Global Clubs, Federations &amp; Brands</span>
      <button type="button" class="marquee-btn" id="speed-toggle">Speed: Normal (1x)</button>
    </div>
    <div class="clients-marquee" id="marquee-row-1">
      <div class="clients-marquee__group">
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#ef4444"></span><span>CLIENT 01</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#3b82f6"></span><span>CLIENT 02</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#0ea5e9"></span><span>CLIENT 03</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#eab308"></span><span>CLIENT 04</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#38bdf8"></span><span>CLIENT 05</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#10b981"></span><span>CLIENT 06</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#f97316"></span><span>CLIENT 07</span></div>
      </div>
    </div>
    <div class="clients-marquee clients-marquee--reverse" id="marquee-row-2">
      <div class="clients-marquee__group">
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#f43f5e"></span><span>CLIENT 08</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#a855f7"></span><span>CLIENT 09</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#6366f1"></span><span>CLIENT 10</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#22c55e"></span><span>CLIENT 11</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#f59e0b"></span><span>CLIENT 12</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#14b8a6"></span><span>CLIENT 13</span></div>
        <div class="clients-marquee__item"><span class="clients-marquee__dot" style="background:#ec4899"></span><span>CLIENT 14</span></div>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
