<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercury Flow Hero</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="mf-hero" id="mfHero">
    <canvas class="mf-canvas" id="mfCanvas" aria-hidden="true"></canvas>
    <div class="mf-shade" aria-hidden="true"></div>
    <div class="mf-inner">
      <span class="mf-pill">New &middot; Fluid surfaces</span>
      <h1 class="mf-title">Design that flows like liquid metal</h1>
      <p class="mf-lead">A living, reflective surface behind your message. Move the pointer and the metal bends around it.</p>
      <div class="mf-actions">
        <a class="mf-btn mf-solid" href="#">Get started</a>
        <a class="mf-btn mf-line" href="#">Learn more</a>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
