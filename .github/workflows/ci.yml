name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: verify, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # package-lock.json is git-ignored in this repo, so cache on package.json
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm run verify
      - run: npm test
      - run: npm run test:e2e

  render:
    name: every feature renders in the builder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check-blank
      - run: npm run check-fields

  exports:
    name: every export opens from disk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check-exports

  responsive:
    name: every feature fits a phone and a tablet window
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check-responsive

  # Reports for people to read. They do not block a pull request: the theme audit over-flags brand-coloured
  # text, and the visual fingerprints depend on the fonts and renderer of the machine that made the baseline.
  reports:
    name: theme, feature and visual reports (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: mkdir -p reports
      - run: npm run check-features
        continue-on-error: true
      - run: npm run audit-themes
        continue-on-error: true
      - run: npm run check-visual | tee reports/visual.txt
        continue-on-error: true
      - run: npm audit --omit=dev | tee reports/npm-audit.txt
        continue-on-error: true
      - run: npm run check-starters
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: reports/
