name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: verify, unit and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # package-lock.json is git-ignored in this repo, so cache on package.json
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm run verify
      - run: npm test
      - run: npm run test:e2e

  render:
    name: every feature renders in the builder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check-blank

  exports:
    name: every export opens from disk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check-exports
